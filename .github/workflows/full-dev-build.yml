name: Full Dev Environment - Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Clone GitHub dependencies and assets
        run: |
          mkdir -p third_party
          git clone --depth 1 https://github.com/BabylonJS/Babylon.js.git third_party/babylonjs || true
          git clone --depth 1 https://github.com/BabylonJS/havok.git third_party/havok || true
          git clone --depth 1 https://github.com/jakearchibald/idb.git third_party/idb || true
          git clone --depth 1 https://github.com/101arrowz/fflate.git third_party/fflate
          git clone --depth 1 https://github.com/KayKit-Game-Assets/KayKit-Medieval-Hexagon-Pack-1.0.git third_party/kaykit-medieval-hexagon
          git clone --depth 1 https://github.com/KayKit-Game-Assets/KayKit-Character-Pack-Skeletons-1.0.git third_party/kaykit-skeletons
      - name: Install client deps
        run: cd client && npm install
      - name: Build web client
        run: cd client && npm run build
      - name: Add Capacitor Android
        run: |
          cd client
          npx cap add android || true
          npx cap sync android
      - name: Build debug APK
        run: |
          cd client/android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: arda-alfajr-debug-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
